name: Polish 0.1.223 profile boundary

on:
  push:
    branches:
      - 'refactor/0.1.223-filemeta-foundation'

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.223-filemeta-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply narrow polish
        run: node scripts/polish-0.1.223.js
      - name: Verify full project
        run: npm run check
      - name: Keep generated runtime out of source commit
        shell: bash
        run: git checkout -- main.js main-bridge.js
      - name: Remove one-time helpers
        shell: bash
        run: rm scripts/polish-0.1.223.js .github/workflows/polish-0.1.223.yml
      - name: Commit verified polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "0.1.223: enforce document-profile presentation boundary"
          git push origin HEAD:refactor/0.1.223-filemeta-foundation
