name: Refactor 0.1.223 filemeta foundation

on:
  push:
    branches:
      - build/0.1.223-filemeta-foundation
    paths:
      - '.github/workflows/refactor-filemeta-0.1.223.yml'

permissions:
  contents: write

jobs:
  refactor-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/0.1.223-filemeta-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply controlled pre-beta metadata refactor
        run: node scripts/refactor-filemeta-0.1.223.js
      - name: Run full verification
        run: npm run check
      - name: Prove Main Bridge is unchanged
        run: git diff --exit-code HEAD -- main-bridge.js
      - name: Commit verified 0.1.223 transformation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git commit -m "0.1.223: generalize metadata foundation for future file types"
          git push origin HEAD:build/0.1.223-filemeta-foundation
