name: Build generated runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
      - 'scripts/source-bundle.js'
      - 'package.json'
      - 'manifest.json'
      - 'scripts/verify/**'
      - 'scripts/check-*.js'
      - 'docs/architecture/**'
      - 'ARCHITECTURE.md'

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and generated runtime
        run: npm run check
      - name: Commit generated runtime when needed
        shell: bash
        run: |
          if git diff --quiet -- main.js main-bridge.js; then
            echo "Generated runtime is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js main-bridge.js
          git commit -m "Build generated runtime [skip ci]"
          git push
