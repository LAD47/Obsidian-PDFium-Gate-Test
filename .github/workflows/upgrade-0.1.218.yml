name: Verify and build 0.1.218 upgrade

on:
  push:
    branches:
      - upgrade/0.1.218
    paths:
      - '.github/workflows/upgrade-0.1.218.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/0.1.218
          fetch-depth: 0

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .upgrade/part*.b64 | base64 -d > /tmp/upgrade-0.1.218.patch
          git apply --whitespace=nowarn /tmp/upgrade-0.1.218.patch

      - name: Build and verify
        run: npm run check

      - name: Commit verified 0.1.218 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upgrade
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade verified baseline to 0.1.218"
          git push origin HEAD:upgrade/0.1.218
