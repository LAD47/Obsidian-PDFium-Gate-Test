name: Verify and build 0.1.218 upgrade

on:
  push:
    branches:
      - upgrade/0.1.218
    paths:
      - '.github/workflows/upgrade-0.1.218.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/0.1.218
          fetch-depth: 0

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .upgrade/part01.b64 \
            .upgrade/part02a.b64 \
            .upgrade/part02b.b64 \
            .upgrade/part03.b64 \
            .upgrade/part04.b64 \
            .upgrade/part05.b64 \
            .upgrade/part06a.b64 \
            .upgrade/part06ba.b64 \
            .upgrade/part06bb.b64 \
            .upgrade/part07.b64 > /tmp/upgrade-0.1.218.b64
          echo '95cb9a95d050f0b6ce24b607eb8e8bff4af214c8be481e1421d2878620b3a57b  /tmp/upgrade-0.1.218.b64' | sha256sum -c -
          base64 -d /tmp/upgrade-0.1.218.b64 > /tmp/upgrade-0.1.218.patch
          echo '73814df91a9795ad118642dbebca73f47cb629e151c493d5cbe5f1926a648f3b  /tmp/upgrade-0.1.218.patch' | sha256sum -c -
          git apply --whitespace=nowarn /tmp/upgrade-0.1.218.patch

      - name: Build and verify
        run: npm run check

      - name: Commit verified 0.1.218 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upgrade
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade verified baseline to 0.1.218"
          git push origin HEAD:upgrade/0.1.218
