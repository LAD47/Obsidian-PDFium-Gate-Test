name: Verify 0.1.223 final branch

on:
  push:
    branches:
      - 'refactor/0.1.223-filemeta-foundation'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.223-filemeta-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify full project
        run: npm run check
      - name: Keep generated runtime out of source branch
        shell: bash
        run: git checkout -- main.js main-bridge.js
      - name: Remove one-time verifier
        shell: bash
        run: rm .github/workflows/verify-0.1.223-final.yml
      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify 0.1.223 final branch"
          git push origin HEAD:refactor/0.1.223-filemeta-foundation
