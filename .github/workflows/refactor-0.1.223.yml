name: Refactor 0.1.223 metadata foundation

on:
  push:
    branches:
      - 'refactor/0.1.223-filemeta-foundation'

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.223-filemeta-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply controlled refactor
        run: node scripts/run-refactor-0.1.223.js
      - name: Verify full project
        run: npm run check
      - name: Keep generated runtime out of source refactor commit
        shell: bash
        run: git checkout -- main.js main-bridge.js
      - name: Remove one-time refactor helpers
        shell: bash
        run: rm scripts/refactor-0.1.223.js scripts/run-refactor-0.1.223.js .github/workflows/refactor-0.1.223.yml
      - name: Commit verified source refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refactor changes produced." >&2
            exit 1
          fi
          git commit -m "0.1.223: generalize metadata record foundation"
          git push origin HEAD:refactor/0.1.223-filemeta-foundation
